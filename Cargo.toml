[workspace]
resolver = "3"
members = ["crates/weft", "crates/weft-http", "crates/weft-bench"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"
repository = "https://github.com/TejasBaid/rust-async-runtime"

[workspace.dependencies]
weft = { path = "crates/weft" }
weft-http = { path = "crates/weft-http" }
libc = "0.2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"

[profile.release]
debug = 1

[profile.bench]
debug = 1
